# Uses a local, private build. Does NOT compile or include any retail game data.
services:
  pes6web:
    image: nginx:1.27-alpine
    container_name: pes6web
    restart: unless-stopped
    ports:
      - "${PES6_PORT:-8613}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./work/psp-web-recomp/games/pes6/root/disc:/usr/share/nginx/disc:ro
    security_opt:
      - no-new-privileges:true
